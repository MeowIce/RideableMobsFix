name: RideableMobs
version: '1.3.0'
main: me.BigBou.rideableMobs.RideableMobs
api-version: '1.21'
authors: [ BigBou ]
depend:
  - ProtocolLib
commands:
  rideablemobs:
    description: Commands of the RideableMobs plugin.
    aliases:
      - rm
    usage: /rideablemobs <command>
    permission: "rideablemobs.commands"
    permission-message: "You do not have permission to use this command"

permissions:
  rideablemobs.commands:
    description: Allows using the base /rm commands
    default: op
  rideablemobs.toggle:
    description: Allows toggling RideableMobs globally
    default: op
