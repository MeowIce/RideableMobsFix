name: RideableMobs
version: '1.3.0'
main: me.BigBou.rideableMobs.RideableMobs
api-version: '1.21'
authors: [ BigBou ]
commands:
  rideablemobs:
    description: Commands of the RideableMobs plugin.
    aliases:
      - rm
    usage: /rideablemobs <command>

permissions:
  rideablemobs.commands:
    description: Legacy access to all RideableMobs commands
    default: op
    children:
      rideablemobs.commands.permission: true
      rideablemobs.commands.reload: true
      rideablemobs.commands.toggle: true
  rideablemobs.toggle:
    description: Legacy access to the toggle command
    default: op
    children:
      rideablemobs.commands.toggle: true
  rideablemobs.commands.permission:
    description: Allows managing ride permissions for players and entity types
    default: op
  rideablemobs.commands.reload:
    description: Allows reloading the RideableMobs configuration
    default: op
  rideablemobs.commands.toggle:
    description: Allows toggling RideableMobs for yourself
    default: op
  rideablemobs.ride.*:
    description: Allows riding all types of mobs
    default: op
