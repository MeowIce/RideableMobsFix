# Language selection for plugin messages. Available languages: en, vi
language: en

# Whether to notify players when certain events occur
plugin-disabled-player-notify: false
no-permission-notify: false
entity-disabled-notify: true

# Setting to establish that the primary hand must be empty in order to ride the entity.
requires-empty-hand: true

# Speed of the entity when riding it. (default: 0.4)
entity-speed: 0.4

# List of worlds where the plugin will work, meaning that you will be able to ride and control any mob.
worlds:
  - world
  - world_nether
  - world_the_end

